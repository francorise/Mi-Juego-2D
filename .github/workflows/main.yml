name: Crear APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear juego
        run: |
          mkdir -p app/src/main/java/com/juego/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }

          rootProject.name='MiJuego2D'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.juego.app'
            compileSdk 35

            defaultConfig {
              applicationId "com.juego.app"
              minSdk 24
              targetSdk 35
              versionCode 4
              versionName "1.3"
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="Mi Juego 2D">

              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>

            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/juego/app/MainActivity.java <<'EOF'
          package com.juego.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.graphics.*;
          import android.view.*;
          import android.widget.*;
          import android.content.Context;
          import android.content.SharedPreferences;

          import java.util.Random;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;

          public class MainActivity extends Activity {

            String nombreJugador = "Jugador";

            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              mostrarMenu();
            }

            TextView crearTexto(
              String texto,
              float tamano,
              int color
            ) {

              TextView t = new TextView(this);
              t.setText(texto);
              t.setTextSize(tamano);
              t.setTextColor(color);
              t.setGravity(Gravity.CENTER);
              t.setPadding(10,20,10,20);

              return t;
            }

            Button crearBoton(String texto) {

              Button b = new Button(this);
              b.setText(texto);
              b.setTextSize(22);

              LinearLayout.LayoutParams lp =
                new LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT,
                  LinearLayout.LayoutParams.WRAP_CONTENT
                );

              lp.setMargins(0,15,0,15);
              b.setLayoutParams(lp);

              return b;
            }

            LinearLayout crearPantalla() {

              LinearLayout pantalla =
                new LinearLayout(this);

              pantalla.setOrientation(
                LinearLayout.VERTICAL
              );

              pantalla.setGravity(
                Gravity.CENTER
              );

              pantalla.setPadding(
                50,50,50,50
              );

              pantalla.setBackgroundColor(
                Color.rgb(20,25,35)
              );

              return pantalla;
            }

            void mostrarMenu() {

              LinearLayout menu =
                crearPantalla();

              TextView titulo =
                crearTexto(
                  "MI JUEGO 2D",
                  36,
                  Color.WHITE
                );

              TextView texto =
                crearTexto(
                  "Ingresa tu nombre",
                  20,
                  Color.LTGRAY
                );

              EditText nombre =
                new EditText(this);

              nombre.setHint(
                "Nombre del jugador"
              );

              nombre.setTextColor(
                Color.WHITE
              );

              nombre.setHintTextColor(
                Color.GRAY
              );

              nombre.setTextSize(20);
              nombre.setSingleLine(true);

              Button start =
                crearBoton("START");

              Button records =
                crearBoton("RÉCORDS");

              menu.addView(titulo);
              menu.addView(texto);
              menu.addView(nombre);
              menu.addView(start);
              menu.addView(records);

              setContentView(menu);

              start.setOnClickListener(v -> {

                String n =
                  nombre
                  .getText()
                  .toString()
                  .trim();

                if (!n.isEmpty()) {
                  nombreJugador = n;
                }

                iniciarJuego(nombreJugador);
              });

              records.setOnClickListener(
                v -> mostrarRecords()
              );
            }

            void iniciarJuego(
              String nombre
            ) {

              nombreJugador = nombre;

              setContentView(
                new Juego(
                  this,
                  nombre
                )
              );
            }

            void mostrarGameOver(
              String nombre,
              int puntos
            ) {

              guardarRecord(
                nombre,
                puntos
              );

              LinearLayout pantalla =
                crearPantalla();

              TextView titulo =
                crearTexto(
                  "TIEMPO AGOTADO",
                  38,
                  Color.RED
                );

              TextView perdiste =
                crearTexto(
                  "PERDISTE",
                  32,
                  Color.WHITE
                );

              TextView jugador =
                crearTexto(
                  "Jugador: " + nombre,
                  24,
                  Color.LTGRAY
                );

              TextView puntaje =
                crearTexto(
                  "Puntaje final: " + puntos,
                  30,
                  Color.WHITE
                );

              Button reiniciar =
                crearBoton(
                  "REINICIAR"
                );

              Button records =
                crearBoton(
                  "VER RÉCORDS"
                );

              Button menu =
                crearBoton(
                  "MENÚ PRINCIPAL"
                );

              pantalla.addView(titulo);
              pantalla.addView(perdiste);
              pantalla.addView(jugador);
              pantalla.addView(puntaje);
              pantalla.addView(reiniciar);
              pantalla.addView(records);
              pantalla.addView(menu);

              setContentView(pantalla);

              reiniciar.setOnClickListener(
                v -> iniciarJuego(nombre)
              );

              records.setOnClickListener(
                v -> mostrarRecords()
              );

              menu.setOnClickListener(
                v -> mostrarMenu()
              );
            }

            static class Registro {

              String nombre;
              int puntos;

              Registro(
                String n,
                int p
              ) {

                nombre = n;
                puntos = p;
              }
            }

            ArrayList<Registro>
            obtenerRecords() {

              SharedPreferences pref =
                getSharedPreferences(
                  "records",
                  MODE_PRIVATE
                );

              String datos =
                pref.getString(
                  "lista",
                  ""
                );

              ArrayList<Registro> lista =
                new ArrayList<>();

              if (!datos.isEmpty()) {

                String[] filas =
                  datos.split("\n");

                for (
                  String fila : filas
                ) {

                  String[] partes =
                    fila.split(
                      "\\|",
                      2
                    );

                  if (
                    partes.length == 2
                  ) {

                    try {

                      int p =
                        Integer.parseInt(
                          partes[1]
                        );

                      lista.add(
                        new Registro(
                          partes[0],
                          p
                        )
                      );

                    } catch (
                      Exception e
                    ) {
                    }
                  }
                }
              }

              Collections.sort(
                lista,
                new Comparator<Registro>() {

                  @Override
                  public int compare(
                    Registro a,
                    Registro b
                  ) {

                    return
                      Integer.compare(
                        b.puntos,
                        a.puntos
                      );
                  }
                }
              );

              return lista;
            }

            void guardarRecord(
              String nombre,
              int puntos
            ) {

              ArrayList<Registro> lista =
                obtenerRecords();

              String nombreSeguro =
                nombre
                .replace("|","")
                .replace("\n"," ")
                .trim();

              if (
                nombreSeguro.isEmpty()
              ) {

                nombreSeguro =
                  "Jugador";
              }

              lista.add(
                new Registro(
                  nombreSeguro,
                  puntos
                )
              );

              Collections.sort(
                lista,
                new Comparator<Registro>() {

                  @Override
                  public int compare(
                    Registro a,
                    Registro b
                  ) {

                    return
                      Integer.compare(
                        b.puntos,
                        a.puntos
                      );
                  }
                }
              );

              while (
                lista.size() > 10
              ) {

                lista.remove(
                  lista.size() - 1
                );
              }

              StringBuilder sb =
                new StringBuilder();

              for (
                int i = 0;
                i < lista.size();
                i++
              ) {

                Registro r =
                  lista.get(i);

                sb.append(r.nombre)
                  .append("|")
                  .append(r.puntos);

                if (
                  i <
                  lista.size() - 1
                ) {

                  sb.append("\n");
                }
              }

              getSharedPreferences(
                "records",
                MODE_PRIVATE
              )
              .edit()
              .putString(
                "lista",
                sb.toString()
              )
              .apply();
            }

            void mostrarRecords() {

              LinearLayout pantalla =
                crearPantalla();

              TextView titulo =
                crearTexto(
                  "RÉCORDS",
                  38,
                  Color.WHITE
                );

              pantalla.addView(titulo);

              ArrayList<Registro> lista =
                obtenerRecords();

              if (
                lista.size() == 0
              ) {

                pantalla.addView(
                  crearTexto(
                    "Todavía no hay récords",
                    22,
                    Color.LTGRAY
                  )
                );

              } else {

                for (
                  int i = 0;
                  i < lista.size();
                  i++
                ) {

                  Registro r =
                    lista.get(i);

                  String linea =
                    (i + 1)
                    + ". "
                    + r.nombre
                    + "  -  "
                    + r.puntos
                    + " puntos";

                  pantalla.addView(
                    crearTexto(
                      linea,
                      22,
                      Color.WHITE
                    )
                  );
                }
              }

              Button volver =
                crearBoton(
                  "VOLVER AL MENÚ PRINCIPAL"
                );

              pantalla.addView(volver);

              setContentView(pantalla);

              volver.setOnClickListener(
                v -> mostrarMenu()
              );
            }

            static class Juego
              extends View {

              MainActivity activity;

              Paint p =
                new Paint(1);

              Random r =
                new Random();

              float x = 100;
              float y = 350;

              float objetivoX = 500;
              float objetivoY = 400;

              int puntos = 0;

              String jugador;

              long finTiempo;

              boolean gameOver =
                false;

              boolean avisoGameOver =
                false;

              boolean bonusActivo =
                false;

              float bonusX = 0;
              float bonusY = 0;

              float velocidadBonus =
                18;

              int proximoBonus = 50;

              long mensajeBonusHasta =
                0;

              long mensajeRojoHasta =
                0;

              static final int
                MAX_ENEMIGOS = 8;

              float[] enemigoX =
                new float[MAX_ENEMIGOS];

              float[] enemigoY =
                new float[MAX_ENEMIGOS];

              boolean enemigosCreados =
                false;

              Juego(
                MainActivity a,
                String nombre
              ) {

                super(a);

                activity = a;
                jugador = nombre;

                finTiempo =
                  SystemClock
                  .uptimeMillis()
                  + 60000;
              }

              void prepararEnemigos() {

                if (
                  enemigosCreados
                ) {
                  return;
                }

                if (
                  getWidth() <= 0 ||
                  getHeight() <= 0
                ) {
                  return;
                }

                for (
                  int i = 0;
                  i < MAX_ENEMIGOS;
                  i++
                ) {

                  moverEnemigo(i);
                }

                enemigosCreados =
                  true;
              }

              void moverEnemigo(
                int i
              ) {

                enemigoX[i] =
                  45
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getWidth() - 90
                  );

                enemigoY[i] =
                  200
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getHeight() - 300
                  );
              }

              int cantidadEnemigos() {

                int cantidad =
                  1 + puntos / 20;

                if (
                  cantidad >
                  MAX_ENEMIGOS
                ) {

                  cantidad =
                    MAX_ENEMIGOS;
                }

                return cantidad;
              }

              @Override
              protected void onDraw(
                Canvas c
              ) {

                long ahora =
                  SystemClock
                  .uptimeMillis();

                long restante =
                  finTiempo - ahora;

                if (
                  restante <= 0
                ) {

                  restante = 0;
                  gameOver = true;
                }

                c.drawColor(
                  Color.rgb(
                    20,
                    25,
                    35
                  )
                );

                p.setColor(
                  Color.WHITE
                );

                p.setTextSize(32);

                c.drawText(
                  "Jugador: "
                  + jugador,
                  30,
                  50,
                  p
                );

                p.setTextSize(29);

                c.drawText(
                  "Puntos: "
                  + puntos,
                  30,
                  95,
                  p
                );

                long segundos =
                  (restante + 999)
                  / 1000;

                long minutos =
                  segundos / 60;

                long seg =
                  segundos % 60;

                String tiempo =
                  String.format(
                    "%02d:%02d",
                    minutos,
                    seg
                  );

                if (
                  segundos <= 10
                ) {

                  p.setColor(
                    Color.RED
                  );

                } else {

                  p.setColor(
                    Color.WHITE
                  );
                }

                p.setTextSize(32);

                c.drawText(
                  "Tiempo: "
                  + tiempo,
                  30,
                  140,
                  p
                );

                if (
                  gameOver
                ) {

                  if (
                    !avisoGameOver
                  ) {

                    avisoGameOver =
                      true;

                    post(() ->
                      activity
                      .mostrarGameOver(
                        jugador,
                        puntos
                      )
                    );
                  }

                  return;
                }

                prepararEnemigos();

                p.setColor(
                  Color.BLUE
                );

                c.drawRect(
                  x,
                  y,
                  x + 90,
                  y + 90,
                  p
                );

                p.setColor(
                  Color.YELLOW
                );

                c.drawCircle(
                  objetivoX,
                  objetivoY,
                  35,
                  p
                );

                if (
                  Math.abs(
                    x + 45
                    - objetivoX
                  ) < 70
                  &&
                  Math.abs(
                    y + 45
                    - objetivoY
                  ) < 70
                ) {

                  puntos++;

                  objetivoX =
                    50
                    + r.nextFloat()
                    * Math.max(
                      1,
                      getWidth()
                      - 100
                    );

                  objetivoY =
                    190
                    + r.nextFloat()
                    * Math.max(
                      1,
                      getHeight()
                      - 270
                    );
                }

                int enemigos =
                  cantidadEnemigos();

                for (
                  int i = 0;
                  i < enemigos;
                  i++
                ) {

                  p.setColor(
                    Color.RED
                  );

                  c.drawCircle(
                    enemigoX[i],
                    enemigoY[i],
                    35,
                    p
                  );

                  if (
                    Math.abs(
                      x + 45
                      - enemigoX[i]
                    ) < 72
                    &&
                    Math.abs(
                      y + 45
                      - enemigoY[i]
                    ) < 72
                  ) {

                    finTiempo -=
                      5000;

                    mensajeRojoHasta =
                      ahora + 1000;

                    moverEnemigo(i);
                  }
                }

                if (
                  puntos >=
                  proximoBonus
                  &&
                  !bonusActivo
                ) {

                  bonusActivo =
                    true;

                  bonusX =
                    40
                    + r.nextFloat()
                    * Math.max(
                      1,
                      getWidth()
                      - 80
                    );

                  bonusY = 180;

                  proximoBonus +=
                    50;
                }

                if (
                  bonusActivo
                ) {

                  bonusY +=
                    velocidadBonus;

                  p.setColor(
                    Color.GREEN
                  );

                  c.drawCircle(
                    bonusX,
                    bonusY,
                    40,
                    p
                  );

                  if (
                    Math.abs(
                      x + 45
                      - bonusX
                    ) < 80
                    &&
                    Math.abs(
                      y + 45
                      - bonusY
                    ) < 80
                  ) {

                    finTiempo +=
                      30000;

                    bonusActivo =
                      false;

                    mensajeBonusHasta =
                      ahora + 1500;
                  }

                  if (
                    bonusY >
                    getHeight() + 50
                  ) {

                    bonusActivo =
                      false;
                  }
                }

                if (
                  ahora <
                  mensajeBonusHasta
                ) {

                  p.setColor(
                    Color.GREEN
                  );

                  p.setTextSize(38);

                  c.drawText(
                    "+30 SEGUNDOS",
                    30,
                    190,
                    p
                  );
                }

                if (
                  ahora <
                  mensajeRojoHasta
                ) {

                  p.setColor(
                    Color.RED
                  );

                  p.setTextSize(38);

                  c.drawText(
                    "-5 SEGUNDOS",
                    30,
                    235,
                    p
                  );
                }

                postInvalidateOnAnimation();
              }

              @Override
              public boolean
              onTouchEvent(
                MotionEvent e
              ) {

                if (
                  gameOver
                ) {
                  return true;
                }

                if (
                  e.getAction()
                  !=
                  MotionEvent
                  .ACTION_UP
                ) {

                  x =
                    e.getX() - 45;

                  y =
                    e.getY() - 45;
                }

                return true;
              }
            }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Juego-2D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
