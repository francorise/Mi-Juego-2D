name: Crear APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear juego
        run: |
          mkdir -p app/src/main/java/com/juego/app

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name='Juego'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.juego.app'
            compileSdk 35

            defaultConfig {
              applicationId "com.juego.app"
              minSdk 24
              targetSdk 35
              versionCode 2
              versionName "1.1"
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="Mi Juego 2D">

              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/juego/app/MainActivity.java <<'EOF'
          package com.juego.app;

          import android.app.*;
          import android.os.*;
          import android.graphics.*;
          import android.view.*;
          import android.widget.*;
          import android.content.*;
          import java.util.*;

          public class MainActivity extends Activity {

            String nombreJugador = "Jugador";

            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              mostrarMenu();
            }

            void mostrarMenu() {

              LinearLayout menu = new LinearLayout(this);
              menu.setOrientation(LinearLayout.VERTICAL);
              menu.setGravity(Gravity.CENTER);
              menu.setPadding(60,60,60,60);
              menu.setBackgroundColor(Color.rgb(20,25,35));

              TextView titulo = new TextView(this);
              titulo.setText("MI JUEGO 2D");
              titulo.setTextSize(36);
              titulo.setTextColor(Color.WHITE);
              titulo.setGravity(Gravity.CENTER);

              TextView subtitulo = new TextView(this);
              subtitulo.setText("Ingresa tu nombre");
              subtitulo.setTextSize(20);
              subtitulo.setTextColor(Color.LTGRAY);
              subtitulo.setGravity(Gravity.CENTER);
              subtitulo.setPadding(0,50,0,20);

              EditText nombre = new EditText(this);
              nombre.setHint("Nombre del jugador");
              nombre.setHintTextColor(Color.GRAY);
              nombre.setTextColor(Color.WHITE);
              nombre.setTextSize(20);
              nombre.setSingleLine(true);
              nombre.setPadding(30,20,30,20);
              nombre.setBackgroundColor(Color.rgb(45,55,70));

              Button start = new Button(this);
              start.setText("START");
              start.setTextSize(24);

              LinearLayout.LayoutParams ancho =
                new LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT,
                  LinearLayout.LayoutParams.WRAP_CONTENT
                );

              ancho.setMargins(0,20,0,20);

              menu.addView(titulo, ancho);
              menu.addView(subtitulo, ancho);
              menu.addView(nombre, ancho);
              menu.addView(start, ancho);

              setContentView(menu);

              start.setOnClickListener(v -> {

                String escrito = nombre.getText().toString().trim();

                if (!escrito.isEmpty()) {
                  nombreJugador = escrito;
                }

                iniciarJuego();
              });
            }

            void iniciarJuego() {
              setContentView(new Juego(this, nombreJugador));
            }

            static class Juego extends View {

              Paint p = new Paint(1);
              Random r = new Random();

              float x = 100;
              float y = 350;

              float cx = 500;
              float cy = 400;

              int pts = 0;

              String jugador;

              Juego(Context c, String nombre) {
                super(c);
                jugador = nombre;
              }

              @Override
              protected void onDraw(Canvas c) {

                c.drawColor(Color.rgb(20,25,35));

                p.setColor(Color.WHITE);
                p.setTextSize(42);
                c.drawText("Mi Juego 2D",30,60,p);

                p.setTextSize(28);
                c.drawText("Jugador: " + jugador,30,105,p);

                p.setTextSize(30);
                c.drawText("Puntos: " + pts,30,145,p);

                p.setColor(Color.BLUE);
                c.drawRect(x,y,x+90,y+90,p);

                p.setColor(Color.YELLOW);
                c.drawCircle(cx,cy,35,p);

                if (
                  Math.abs(x+45-cx) < 70 &&
                  Math.abs(y+45-cy) < 70
                ) {

                  pts++;

                  cx = 50
