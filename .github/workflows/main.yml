name: Crear APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear juego
        run: |
          mkdir -p app/src/main/java/com/juego/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }

          rootProject.name='MiJuego2D'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.juego.app'
            compileSdk 35

            defaultConfig {
              applicationId "com.juego.app"
              minSdk 24
              targetSdk 35
              versionCode 5
              versionName "1.4"
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="Mi Juego 2D">

              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/juego/app/MainActivity.java <<'EOF'
          package com.juego.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.graphics.*;
          import android.view.*;
          import android.widget.*;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.media.AudioManager;
          import android.media.ToneGenerator;

          import java.util.Random;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;

          public class MainActivity extends Activity {

            String nombreJugador = "Jugador";

            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              mostrarMenu();
            }

            TextView crearTexto(
              String texto,
              float tamano,
              int color
            ) {
              TextView t = new TextView(this);
              t.setText(texto);
              t.setTextSize(tamano);
              t.setTextColor(color);
              t.setGravity(Gravity.CENTER);
              t.setPadding(10,20,10,20);
              return t;
            }

            Button crearBoton(String texto) {
              Button b = new Button(this);
              b.setText(texto);
              b.setTextSize(22);

              LinearLayout.LayoutParams lp =
                new LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT,
                  LinearLayout.LayoutParams.WRAP_CONTENT
                );

              lp.setMargins(0,15,0,15);
              b.setLayoutParams(lp);
              return b;
            }

            LinearLayout crearPantalla() {
              LinearLayout pantalla =
                new LinearLayout(this);

              pantalla.setOrientation(
                LinearLayout.VERTICAL
              );

              pantalla.setGravity(
                Gravity.CENTER
              );

              pantalla.setPadding(
                50,50,50,50
              );

              pantalla.setBackgroundColor(
                Color.rgb(20,25,35)
              );

              return pantalla;
            }

            void mostrarMenu() {
              LinearLayout menu =
                crearPantalla();

              TextView titulo =
                crearTexto(
                  "MI JUEGO 2D",
                  36,
                  Color.WHITE
                );

              TextView subtitulo =
                crearTexto(
                  "1 minuto para conseguir el máximo puntaje",
                  18,
                  Color.LTGRAY
                );

              TextView texto =
                crearTexto(
                  "Ingresa tu nombre",
                  20,
                  Color.WHITE
                );

              EditText nombre =
                new EditText(this);

              nombre.setHint(
                "Nombre del jugador"
              );

              nombre.setTextColor(
                Color.WHITE
              );

              nombre.setHintTextColor(
                Color.GRAY
              );

              nombre.setTextSize(20);
              nombre.setSingleLine(true);

              Button start =
                crearBoton("START");

              Button records =
                crearBoton("RÉCORDS");

              menu.addView(titulo);
              menu.addView(subtitulo);
              menu.addView(texto);
              menu.addView(nombre);
              menu.addView(start);
              menu.addView(records);

              setContentView(menu);

              start.setOnClickListener(v -> {
                String n =
                  nombre
                  .getText()
                  .toString()
                  .trim();

                if (!n.isEmpty()) {
                  nombreJugador = n;
                }

                iniciarJuego(
                  nombreJugador
                );
              });

              records.setOnClickListener(
                v -> mostrarRecords()
              );
            }

            void iniciarJuego(
              String nombre
            ) {
              nombreJugador = nombre;

              setContentView(
                new Juego(
                  this,
                  nombre
                )
              );
            }

            void mostrarGameOver(
              String nombre,
              int puntos,
              int nivel
            ) {
              guardarRecord(
                nombre,
                puntos
              );

              LinearLayout pantalla =
                crearPantalla();

              pantalla.addView(
                crearTexto(
                  "TIEMPO AGOTADO",
                  38,
                  Color.RED
                )
              );

              pantalla.addView(
                crearTexto(
                  "PERDISTE",
                  30,
                  Color.WHITE
                )
              );

              pantalla.addView(
                crearTexto(
                  "Jugador: " + nombre,
                  23,
                  Color.LTGRAY
                )
              );

              pantalla.addView(
                crearTexto(
                  "Puntaje: " + puntos,
                  32,
                  Color.WHITE
                )
              );

              pantalla.addView(
                crearTexto(
                  "Nivel alcanzado: " + nivel,
                  24,
                  Color.WHITE
                )
              );

              Button reiniciar =
                crearBoton(
                  "REINICIAR"
                );

              Button records =
                crearBoton(
                  "VER RÉCORDS"
                );

              Button menu =
                crearBoton(
                  "MENÚ PRINCIPAL"
                );

              pantalla.addView(
                reiniciar
              );

              pantalla.addView(
                records
              );

              pantalla.addView(
                menu
              );

              setContentView(
                pantalla
              );

              reiniciar.setOnClickListener(
                v -> iniciarJuego(nombre)
              );

              records.setOnClickListener(
                v -> mostrarRecords()
              );

              menu.setOnClickListener(
                v -> mostrarMenu()
              );
            }

            static class Registro {
              String nombre;
              int puntos;

              Registro(
                String n,
                int p
              ) {
                nombre = n;
                puntos = p;
              }
            }

            ArrayList<Registro>
            obtenerRecords() {
              SharedPreferences pref =
                getSharedPreferences(
                  "records",
                  MODE_PRIVATE
                );

              String datos =
                pref.getString(
                  "lista",
                  ""
                );

              ArrayList<Registro> lista =
                new ArrayList<>();

              if (!datos.isEmpty()) {
                String[] filas =
                  datos.split("\n");

                for (
                  String fila : filas
                ) {
                  String[] partes =
                    fila.split(
                      "\\|",
                      2
                    );

                  if (
                    partes.length == 2
                  ) {
                    try {
                      lista.add(
                        new Registro(
                          partes[0],
                          Integer.parseInt(
                            partes[1]
                          )
                        )
                      );
                    } catch (
                      Exception e
                    ) {
                    }
                  }
                }
              }

              Collections.sort(
                lista,
                new Comparator<Registro>() {
                  @Override
                  public int compare(
                    Registro a,
                    Registro b
                  ) {
                    return Integer.compare(
                      b.puntos,
                      a.puntos
                    );
                  }
                }
              );

              return lista;
            }

            void guardarRecord(
              String nombre,
              int puntos
            ) {
              ArrayList<Registro> lista =
                obtenerRecords();

              String nombreSeguro =
                nombre
                .replace("|","")
                .replace("\n"," ")
                .trim();

              if (
                nombreSeguro.isEmpty()
              ) {
                nombreSeguro =
                  "Jugador";
              }

              lista.add(
                new Registro(
                  nombreSeguro,
                  puntos
                )
              );

              Collections.sort(
                lista,
                new Comparator<Registro>() {
                  @Override
                  public int compare(
                    Registro a,
                    Registro b
                  ) {
                    return Integer.compare(
                      b.puntos,
                      a.puntos
                    );
                  }
                }
              );

              while (
                lista.size() > 10
              ) {
                lista.remove(
                  lista.size() - 1
                );
              }

              StringBuilder sb =
                new StringBuilder();

              for (
                int i = 0;
                i < lista.size();
                i++
              ) {
                Registro r =
                  lista.get(i);

                sb.append(r.nombre)
                  .append("|")
                  .append(r.puntos);

                if (
                  i < lista.size() - 1
                ) {
                  sb.append("\n");
                }
              }

              getSharedPreferences(
                "records",
                MODE_PRIVATE
              )
              .edit()
              .putString(
                "lista",
                sb.toString()
              )
              .apply();
            }

            void mostrarRecords() {
              LinearLayout pantalla =
                crearPantalla();

              pantalla.addView(
                crearTexto(
                  "🏆 RÉCORDS",
                  38,
                  Color.WHITE
                )
              );

              ArrayList<Registro> lista =
                obtenerRecords();

              if (
                lista.size() == 0
              ) {
                pantalla.addView(
                  crearTexto(
                    "Todavía no hay récords",
                    22,
                    Color.LTGRAY
                  )
                );
              } else {
                for (
                  int i = 0;
                  i < lista.size();
                  i++
                ) {
                  Registro r =
                    lista.get(i);

                  pantalla.addView(
                    crearTexto(
                      (i + 1)
                      + ". "
                      + r.nombre
                      + "  -  "
                      + r.puntos
                      + " puntos",
                      22,
                      Color.WHITE
                    )
                  );
                }
              }

              Button volver =
                crearBoton(
                  "VOLVER AL MENÚ PRINCIPAL"
                );

              pantalla.addView(
                volver
              );

              setContentView(
                pantalla
              );

              volver.setOnClickListener(
                v -> mostrarMenu()
              );
            }

            static class Juego
              extends View {

              MainActivity activity;

              Paint p =
                new Paint(1);

              Random r =
                new Random();

              ToneGenerator sonido =
                new ToneGenerator(
                  AudioManager.STREAM_MUSIC,
                  70
                );

              float x = 100;
              float y = 350;

              float objetivoX = 500;
              float objetivoY = 400;

              int puntos = 0;
              int nivel = 1;

              String jugador;

              long finTiempo = 0;

              boolean gameOver =
                false;

              boolean avisoGameOver =
                false;

              boolean cuentaRegresiva =
                true;

              long cuentaInicio;

              int estadoCuentaAnterior =
                -99;

              boolean pausado =
                false;

              long pausaInicio = 0;

              int racha = 0;
              int multiplicador = 1;

              long ultimoAmarillo = 0;

              boolean bonusActivo =
                false;

              float bonusX = 0;
              float bonusY = 0;

              float velocidadBonus =
                18;

              int proximoBonus = 50;

              long mensajeBonusHasta =
                0;

              long mensajeRojoHasta =
                0;

              long mensajeNivelHasta =
                0;

              boolean escudoVisible =
                false;

              float escudoX = 0;
              float escudoY = 0;

              long escudoVisibleHasta =
                0;

              long escudoHasta =
                0;

              long mensajeEscudoHasta =
                0;

              int proximoEscudo =
                75;

              static final int
                MAX_ENEMIGOS = 8;

              float[] enemigoX =
                new float[MAX_ENEMIGOS];

              float[] enemigoY =
                new float[MAX_ENEMIGOS];

              boolean enemigosCreados =
                false;

              Juego(
                MainActivity a,
                String nombre
              ) {
                super(a);

                activity = a;
                jugador = nombre;

                cuentaInicio =
                  SystemClock
                  .uptimeMillis();
              }

              void beep(
                int tipo,
                int duracion
              ) {
                try {
                  sonido.startTone(
                    tipo,
                    duracion
                  );
                } catch (
                  Exception e
                ) {
                }
              }

              void prepararEnemigos() {
                if (
                  enemigosCreados
                  ||
                  getWidth() <= 0
                  ||
                  getHeight() <= 0
                ) {
                  return;
                }

                for (
                  int i = 0;
                  i < MAX_ENEMIGOS;
                  i++
                ) {
                  moverEnemigo(i);
                }

                enemigosCreados = true;
              }

              void moverEnemigo(
                int i
              ) {
                enemigoX[i] =
                  45
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getWidth() - 90
                  );

                enemigoY[i] =
                  220
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getHeight() - 330
                  );
              }

              int cantidadEnemigos() {
                int cantidad =
                  1 + puntos / 20;

                if (
                  cantidad >
                  MAX_ENEMIGOS
                ) {
                  cantidad =
                    MAX_ENEMIGOS;
                }

                return cantidad;
              }

              void moverObjetivo() {
                objetivoX =
                  50
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getWidth() - 100
                  );

                objetivoY =
                  220
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getHeight() - 310
                  );
              }

              void generarEscudo(
                long ahora
              ) {
                escudoVisible = true;

                escudoX =
                  45
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getWidth() - 90
                  );

                escudoY =
                  230
                  + r.nextFloat()
                  * Math.max(
                    1,
                    getHeight() - 330
                  );

                escudoVisibleHasta =
                  ahora + 8000;

                proximoEscudo += 75;
              }

              boolean escudoActivo(
                long ahora
              ) {
                return ahora <
                  escudoHasta;
              }

              void alternarPausa() {
                if (
                  cuentaRegresiva
                  ||
                  gameOver
                ) {
                  return;
                }

                long ahora =
                  SystemClock
                  .uptimeMillis();

                if (!pausado) {
                  pausado = true;
                  pausaInicio = ahora;

                  beep(
                    ToneGenerator.TONE_PROP_BEEP,
                    80
                  );

                } else {
                  long diferencia =
                    ahora - pausaInicio;

                  finTiempo += diferencia;

                  if (
                    ultimoAmarillo > 0
                  ) {
                    ultimoAmarillo +=
                      diferencia;
                  }

                  if (
                    escudoHasta > 0
                  ) {
                    escudoHasta +=
                      diferencia;
                  }

                  if (
                    escudoVisibleHasta > 0
                  ) {
                    escudoVisibleHasta +=
                      diferencia;
                  }

                  mensajeBonusHasta +=
                    diferencia;

                  mensajeRojoHasta +=
                    diferencia;

                  mensajeNivelHasta +=
                    diferencia;

                  mensajeEscudoHasta +=
                    diferencia;

                  pausado = false;

                  beep(
                    ToneGenerator.TONE_PROP_BEEP2,
                    80
                  );
                }

                invalidate();
              }

              boolean tocaPausa(
                float tx,
                float ty
              ) {
                return
                  tx >=
                  getWidth() - 220
                  &&
                  ty >= 15
                  &&
                  ty <= 105;
              }

              void dibujarBotonPausa(
                Canvas c
              ) {
                float izquierda =
                  Math.max(
                    10,
                    getWidth() - 220
                  );

                p.setColor(
                  Color.rgb(
                    55,
                    65,
                    80
                  )
                );

                c.drawRoundRect(
                  izquierda,
                  20,
                  getWidth() - 20,
                  95,
                  18,
                  18,
                  p
                );

                p.setColor(
                  Color.WHITE
                );

                p.setTextSize(27);

                c.drawText(
                  pausado
                    ? "SEGUIR"
                    : "PAUSA",
                  izquierda + 30,
                  70,
                  p
                );
              }

              void dibujarCabecera(
                Canvas c,
                long restante,
                long referencia
              ) {
                p.setColor(
                  Color.WHITE
                );

                p.setTextSize(30);

                c.drawText(
                  "Jugador: " + jugador,
                  25,
                  45,
                  p
                );

                p.setTextSize(27);

                c.drawText(
                  "Puntos: " + puntos,
                  25,
                  85,
                  p
                );

                c.drawText(
                  "Nivel: " + nivel,
                  25,
                  125,
                  p
                );

                long segundos =
                  (restante + 999)
                  / 1000;

                long minutos =
                  segundos / 60;

                long seg =
                  segundos % 60;

                String tiempo =
                  String.format(
                    "%02d:%02d",
                    minutos,
                    seg
                  );

                if (
                  segundos <= 10
                ) {
                  p.setColor(
                    Color.RED
                  );
                } else {
                  p.setColor(
                    Color.WHITE
                  );
                }

                p.setTextSize(30);

                c.drawText(
                  "Tiempo: " + tiempo,
                  25,
                  165,
                  p
                );

                if (
                  multiplicador > 1
                ) {
                  p.setColor(
                    Color.YELLOW
                  );

                  p.setTextSize(27);

                  c.drawText(
                    "COMBO x"
                    + multiplicador,
                    25,
                    205,
                    p
                  );
                }

                if (
                  escudoActivo(
                    referencia
                  )
                ) {
                  long restanteEscudo =
                    Math.max(
                      0,
                      (
                        escudoHasta
                        - referencia
                      )
                      / 1000
                    );

                  p.setColor(
                    Color.CYAN
                  );

                  p.setTextSize(25);

                  c.drawText(
                    "ESCUDO: "
                    + restanteEscudo
                    + "s",
                    25,
                    240,
                    p
                  );
                }
              }

              void dibujarCuenta(
                Canvas c,
                long ahora
              ) {
                long transcurrido =
                  ahora - cuentaInicio;

                String texto;
                int estado;

                if (
                  transcurrido < 1000
                ) {
                  texto = "3";
                  estado = 3;

                } else if (
                  transcurrido < 2000
                ) {
                  texto = "2";
                  estado = 2;

                } else if (
                  transcurrido < 3000
                ) {
                  texto = "1";
                  estado = 1;

                } else if (
                  transcurrido < 3800
                ) {
                  texto = "¡YA!";
                  estado = 0;

                } else {
                  cuentaRegresiva =
                    false;

                  finTiempo =
                    ahora + 60000;

                  beep(
                    ToneGenerator.TONE_PROP_ACK,
                    120
                  );

                  postInvalidateOnAnimation();
                  return;
                }

                if (
                  estado !=
                  estadoCuentaAnterior
                ) {
                  estadoCuentaAnterior =
                    estado;

                  beep(
                    estado == 0
                      ? ToneGenerator.TONE_PROP_ACK
                      : ToneGenerator.TONE_PROP_BEEP,
                    100
                  );
                }

                p.setColor(
                  Color.WHITE
                );

                p.setTextSize(
                  estado == 0
                    ? 75
                    : 110
                );

                p.setTextAlign(
                  Paint.Align.CENTER
                );

                c.drawText(
                  texto,
                  getWidth() / 2f,
                  getHeight() / 2f,
                  p
                );

                p.setTextAlign(
                  Paint.Align.LEFT
                );

                postInvalidateOnAnimation();
              }

              @Override
              protected void onDraw(
                Canvas c
              ) {
                long ahora =
                  SystemClock
                  .uptimeMillis();

                c.drawColor(
                  Color.rgb(
                    20,
                    25,
                    35
                  )
                );

                if (
                  cuentaRegresiva
                ) {
                  p.setColor(
                    Color.WHITE
                  );

                  p.setTextSize(30);

                  c.drawText(
                    "Prepárate, "
                    + jugador,
                    30,
                    70,
                    p
                  );

                  dibujarCuenta(
                    c,
                    ahora
                  );

                  return;
                }

                long referencia =
                  pausado
                    ? pausaInicio
                    : ahora;

                long restante =
                  finTiempo
                  - referencia;

                if (
                  restante <= 0
                ) {
                  restante = 0;
                  gameOver = true;
                }

                dibujarCabecera(
                  c,
                  restante,
                  referencia
                );

                dibujarBotonPausa(
                  c
                );

                if (
                  gameOver
                ) {
                  if (
                    !avisoGameOver
                  ) {
                    avisoGameOver =
                      true;

                    beep(
                      ToneGenerator.TONE_PROP_NACK,
                      500
                    );

                    try {
                      sonido.release();
                    } catch (
                      Exception e
                    ) {
                    }

                    post(() ->
                      activity
                      .mostrarGameOver(
                        jugador,
                        puntos,
                        nivel
                      )
                    );
                  }

                  return;
                }

                if (
                  pausado
                ) {
                  p.setColor(
                    Color.argb(
                      190,
                      0,
                      0,
                      0
                    )
                  );

                  c.drawRect(
                    0,
                    110,
                    getWidth(),
                    getHeight(),
                    p
                  );

                  p.setColor(
                    Color.WHITE
                  );

                  p.setTextSize(65);

                  p.setTextAlign(
                    Paint.Align.CENTER
                  );

                  c.drawText(
                    "PAUSA",
                    getWidth() / 2f,
                    getHeight() / 2f,
                    p
                  );

                  p.setTextSize(24);

                  c.drawText(
                    "Toca SEGUIR para continuar",
                    getWidth() / 2f,
                    getHeight() / 2f + 55,
                    p
                  );

                  p.setTextAlign(
                    Paint.Align.LEFT
                  );

                  return;
                }

                prepararEnemigos();

                if (
                  multiplicador > 1
                  &&
                  ultimoAmarillo > 0
                  &&
                  ahora
                  - ultimoAmarillo
                  > 2000
                ) {
                  racha = 0;
                  multiplicador = 1;
                }

                p.setColor(
                  escudoActivo(ahora)
                    ? Color.CYAN
                    : Color.BLUE
                );

                c.drawRect(
                  x,
                  y,
                  x + 90,
                  y + 90,
                  p
                );

                p.setColor(
                  Color.YELLOW
                );

                c.drawCircle(
                  objetivoX,
                  objetivoY,
                  35,
                  p
                );

                if (
                  Math.abs(
                    x + 45
                    - objetivoX
                  ) < 70
                  &&
                  Math.abs(
                    y + 45
                    - objetivoY
                  ) < 70
                ) {
                  if (
                    ultimoAmarillo > 0
                    &&
                    ahora
                    - ultimoAmarillo
                    <= 2000
                  ) {
                    racha++;
                  } else {
                    racha = 1;
                  }

                  if (
                    racha >= 5
                  ) {
                    multiplicador = 3;
                  } else if (
                    racha >= 2
                  ) {
                    multiplicador = 2;
                  } else {
                    multiplicador = 1;
                  }

                  puntos +=
                    multiplicador;

                  ultimoAmarillo =
                    ahora;

                  beep(
                    ToneGenerator.TONE_PROP_BEEP,
                    60
                  );

                  int nuevoNivel =
                    1 + puntos / 100;

                  if (
                    nuevoNivel > nivel
                  ) {
                    nivel =
                      nuevoNivel;

                    mensajeNivelHasta =
                      ahora + 1800;

                    beep(
                      ToneGenerator.TONE_PROP_ACK,
                      250
                    );
                  }

                  moverObjetivo();
                }

                int enemigos =
                  cantidadEnemigos();

                for (
                  int i = 0;
                  i < enemigos;
                  i++
                ) {
                  p.setColor(
                    Color.RED
                  );

                  c.drawCircle(
                    enemigoX[i],
                    enemigoY[i],
                    35,
                    p
                  );

                  if (
                    Math.abs(
                      x + 45
                      - enemigoX[i]
                    ) < 72
                    &&
                    Math.abs(
                      y + 45
                      - enemigoY[i]
                    ) < 72
                  ) {
                    if (
                      escudoActivo(
                        ahora
                      )
                    ) {
                      mensajeEscudoHasta =
                        ahora + 900;

                      beep(
                        ToneGenerator.TONE_PROP_BEEP2,
                        80
                      );

                    } else {
                      finTiempo -=
                        5000;

                      mensajeRojoHasta =
                        ahora + 1000;

                      beep(
                        ToneGenerator.TONE_PROP_NACK,
                        120
                      );
                    }

                    moverEnemigo(i);
                  }
                }

                if (
                  puntos >=
                  proximoBonus
                  &&
                  !bonusActivo
                ) {
                  bonusActivo =
                    true;

                  bonusX =
                    40
                    + r.nextFloat()
                    * Math.max(
                      1,
                      getWidth() - 80
                    );

                  bonusY = 200;

                  proximoBonus +=
                    50;
                }

                if (
                  bonusActivo
                ) {
                  bonusY +=
                    velocidadBonus;

                  p.setColor(
                    Color.GREEN
                  );

                  c.drawCircle(
                    bonusX,
                    bonusY,
                    40,
                    p
                  );

                  if (
                    Math.abs(
                      x + 45
                      - bonusX
                    ) < 80
                    &&
                    Math.abs(
                      y + 45
                      - bonusY
                    ) < 80
                  ) {
                    finTiempo +=
                      30000;

                    bonusActivo =
                      false;

                    mensajeBonusHasta =
                      ahora + 1500;

                    beep(
                      ToneGenerator.TONE_PROP_ACK,
                      180
                    );
                  }

                  if (
                    bonusY >
                    getHeight() + 50
                  ) {
                    bonusActivo =
                      false;
                  }
                }

                if (
                  puntos >=
                  proximoEscudo
                  &&
                  !escudoVisible
                ) {
                  generarEscudo(
                    ahora
                  );
                }

                if (
                  escudoVisible
                ) {
                  if (
                    ahora >
                    escudoVisibleHasta
                  ) {
                    escudoVisible =
                      false;

                  } else {
                    p.setColor(
                      Color.CYAN
                    );

                    c.drawCircle(
                      escudoX,
                      escudoY,
                      42,
                      p
                    );

                    p.setColor(
                      Color.WHITE
                    );

                    p.setTextSize(30);

                    p.setTextAlign(
                      Paint.Align.CENTER
                    );

                    c.drawText(
                      "S",
                      escudoX,
                      escudoY + 10,
                      p
                    );

                    p.setTextAlign(
                      Paint.Align.LEFT
                    );

                    if (
                      Math.abs(
                        x + 45
                        - escudoX
                      ) < 82
                      &&
                      Math.abs(
                        y + 45
                        - escudoY
                      ) < 82
                    ) {
                      escudoVisible =
                        false;

                      escudoHasta =
                        ahora + 10000;

                      mensajeEscudoHasta =
                        ahora + 1500;

                      beep(
                        ToneGenerator.TONE_PROP_BEEP2,
                        250
                      );
                    }
                  }
                }

                if (
                  ahora <
                  mensajeBonusHasta
                ) {
                  p.setColor(
                    Color.GREEN
                  );

                  p.setTextSize(38);

                  c.drawText(
                    "+30 SEGUNDOS",
                    30,
                    285,
                    p
                  );
                }

                if (
                  ahora <
                  mensajeRojoHasta
                ) {
                  p.setColor(
                    Color.RED
                  );

                  p.setTextSize(38);

                  c.drawText(
                    "-5 SEGUNDOS",
                    30,
                    330,
                    p
                  );
                }

                if (
                  ahora <
                  mensajeEscudoHasta
                ) {
                  p.setColor(
                    Color.CYAN
                  );

                  p.setTextSize(36);

                  c.drawText(
                    escudoActivo(ahora)
                      ? "¡ESCUDO ACTIVADO!"
                      : "¡ESCUDO TE PROTEGIÓ!",
                    30,
                    375,
                    p
                  );
                }

                if (
                  ahora <
                  mensajeNivelHasta
                ) {
                  p.setColor(
                    Color.YELLOW
                  );

                  p.setTextSize(45);

                  p.setTextAlign(
                    Paint.Align.CENTER
                  );

                  c.drawText(
                    "¡NIVEL "
                    + nivel
                    + "!",
                    getWidth() / 2f,
                    getHeight() / 2f,
                    p
                  );

                  p.setTextAlign(
                    Paint.Align.LEFT
                  );
                }

                postInvalidateOnAnimation();
              }

              @Override
              public boolean
              onTouchEvent(
                MotionEvent e
              ) {
                if (
                  e.getAction()
                  ==
                  MotionEvent.ACTION_DOWN
                  &&
                  tocaPausa(
                    e.getX(),
                    e.getY()
                  )
                ) {
                  alternarPausa();
                  return true;
                }

                if (
                  gameOver
                  ||
                  pausado
                  ||
                  cuentaRegresiva
                ) {
                  return true;
                }

                if (
                  e.getAction()
                  !=
                  MotionEvent.ACTION_UP
                ) {
                  x =
                    e.getX() - 45;

                  y =
                    e.getY() - 45;
                }

                return true;
              }
            }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Juego-2D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
